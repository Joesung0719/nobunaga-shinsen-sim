<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>真戰開荒隊伍推薦</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--ink:#121010;--lacquer:#1d1917;--line:#3a322b;--paper:#efe3c8;--muted:#a39882;--gold:#e3b75a;--violet:#b77cff;--steel:#7fa3d6;--vermilion:#c8442c;--jade:#5fb58a;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--display);font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.08em;color:var(--gold)}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.panel{background:var(--lacquer);border:1px solid var(--line);border-radius:6px;padding:14px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lbl{font-size:.74rem;color:var(--muted);min-width:4.5em}
.chip{cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:inherit;font-size:.82rem}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.chip:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.filters{display:flex;flex-direction:column;gap:10px}
input[type=range]{accent-color:var(--gold);flex:1;min-width:140px;max-width:260px}
h2{font-family:var(--display);font-size:1.1rem;margin:0 0 8px;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.team{border:1px solid var(--line);border-radius:8px;background:#171412;padding:10px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start}
.team .no{font-family:var(--display);font-size:1.3rem;color:var(--gold);font-weight:900}
.gens{display:flex;flex-direction:column;gap:6px}
.g{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.86rem}
.g b{font-family:var(--display);font-size:1rem}
.g .rc{font-size:.7rem;border-radius:3px;padding:1px 6px;background:#000a}
.r5{color:#e3b75a}.r4{color:#b77cff}.r3{color:#7fa3d6}
.g .sk{font-size:.74rem;color:var(--muted)}
.g .sk i{font-style:normal;color:var(--paper);border-bottom:1px dotted var(--muted);cursor:help}
.meta{font-size:.74rem;color:var(--muted);margin-top:4px}
.big{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}
.big b{font-size:1.6rem;color:var(--jade);display:block;line-height:1.1}
.big small{display:block;font-size:.72rem;color:var(--muted);font-family:var(--body)}
.big .res{color:var(--gold);font-size:1rem}
.note{font-size:.76rem;color:var(--muted);line-height:1.8}
.note li{margin-bottom:3px}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:560px){.team{grid-template-columns:28px minmax(0,1fr)}.big{grid-column:2;text-align:left;display:flex;gap:16px;align-items:baseline}.big b{display:inline}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>開荒隊伍推薦</h1><p>總 Cost 上限內、資源最少、戰法滿級 · 戰鬥引擎模擬估算</p></div>
    <nav class="site" aria-label="頁面"><a href="./">登用模擬</a><a href="generals.html">武將資料庫</a><a href="land.html">組隊分析</a><a href="slg.html?m=camp">Q版戰棋</a></nav>
  </header>

  <section class="panel filters">
    <div class="row" id="fLand"></div>
    <div class="row" id="fProf"></div>
    <div class="row" id="fTier"></div>
    <div class="row" id="fCost"></div>
    <div class="row"><span class="lbl">最低勝率</span><input type="range" id="thr" min="30" max="100" step="5" aria-label="最低勝率"><b id="thrV"></b></div>
  </section>

  <section class="panel"><h2>最省資源（達到勝率門檻）</h2><div class="list" id="cheap"></div></section>
  <section class="panel"><h2>勝率最高</h2><div class="list" id="best"></div></section>
  <section class="panel note" id="asm"></section>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))x==='class'?e.className=v:e.setAttribute(x,v);for(const c of k)if(c!=null)e.append(c);return e};
let R;try{R=await fetch('recommend.json',{cache:'no-cache'}).then(r=>r.json())}catch{}
if(!R){document.querySelector('.wrap').append(el('p',{class:'empty'},'recommend.json 讀取失敗'));throw 0}
const A=R.assumptions,KEY='shinsen-rec-v2';
const S=Object.assign({land:7,prof:'40_0',tier:'mid',cost:A.costCap,thr:70},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}})());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const TIER_T={cheap:'不抽高星來源（3★ 來源目前沒有可模擬戰法＝不傳授）',mid:'傳授戰法來源 ≤4★',any:'傳授戰法不限來源（含 5★）'};
function chips(box,label,opts,key){box.replaceChildren(el('span',{class:'lbl'},label));
  for(const[k,t]of opts){const b=el('button',{class:'chip',type:'button','aria-pressed':String(String(S[key])===String(k))},t);b.onclick=()=>{S[key]=typeof k==='number'?k:k;save();render()};box.append(b)}}
const fmt=n=>n.toLocaleString('en-US');
function render(){
  chips($('fLand'),'目標土地',A.lands.map(l=>[l,`Lv${l}`]),'land');
  chips($('fProf'),'武將養成',A.profiles.map(p=>[`${p.lv}_${p.red}`,`Lv${p.lv}・${p.red?'滿紅':'0 紅'}`]),'prof');
  chips($('fTier'),'戰法來源',Object.entries(TIER_T),'tier');
  const cs=[];for(let c=9;c<=A.costCap;c++)cs.push([c,`≤${c}`]);chips($('fCost'),'總 Cost',cs,'cost');
  $('thr').value=S.thr;$('thrV').textContent=S.thr+'%';
  const red=S.prof.endsWith('_5'),order={cheap:0,mid:1,any:2};
  const rows=R.teams.filter(t=>t.c<=S.cost&&order[t.tier]<=order[S.tier]&&t.prof[S.prof]).map(t=>{
    const p=t.prof[S.prof][S.land],r=red?t.res5:t.res;return{t,w:p[0],left:p[1],res:r.gen+r.skill,r}});
  // 同一組合只留一個版本（階層限制內，資源最少者）
  const uniq=new Map();for(const x of rows){const k=x.t.names.join('|')+x.t.arm+x.t.sk.flat();const o=uniq.get(k);if(!o||x.res<o.res)uniq.set(k,x)}
  const all=[...uniq.values()];
  const ok=all.filter(x=>x.w>=S.thr).sort((a,b)=>a.res-b.res||b.w-a.w||b.left-a.left).slice(0,8);
  const best=all.slice().sort((a,b)=>b.w-a.w||b.left-a.left||a.res-b.res).slice(0,8);
  draw($('cheap'),ok,`沒有隊伍達到 ${S.thr}% 勝率，調低門檻或放寬條件看看。`);draw($('best'),best,'沒有資料');
  $('asm').replaceChildren(el('h2',{},'假設與限制（推估，等 Joe 確認）'),el('ul',{},...[
    A.team,`武將數值：${A.profiles.map(p=>`Lv${p.lv}${p.red?'滿紅':'0 紅'}`).join('、')}；設施 協力 Lv${A.fac.co}、兵種營 Lv${A.fac.arm}；每位兵力 ${fmt(A.troops)}`,
    A.skills,'目前能模擬的可傳授戰法只有 31 個（其餘沒有說明文字，等收集器補齊），所以多數隊伍的傳授戰法欄位會有空缺；補到資料後重跑 tools/recommend.mjs 會自動填滿。',A.resource,A.winrate,`建立日期 ${A.built}（tools/recommend.mjs 重跑可更新）。兵學、裝備、天候與 5 分鐘平局重打都還沒算進去。`].map(x=>el('li',{},x))));
}
$('thr').oninput=e=>{S.thr=+e.target.value;save();render()};
function draw(box,list,none){
  if(!list.length){box.replaceChildren(el('p',{class:'empty'},none));return}
  box.replaceChildren(...list.map((x,i)=>{const t=x.t;
    const gens=t.names.map((n,gi)=>{const g=R.gens[n];
      const skills=[g.inn,...t.sk[gi]].filter(Boolean).map(s=>{const sk=R.skills[s];return el('i',{title:sk?.text||'固有戰法'},s)});
      const sk=el('span',{class:'sk'});skills.forEach((s,j)=>{if(j)sk.append('・');sk.append(s)});for(let m=skills.length;m<3;m++)sk.append(el('span',{title:'可傳授戰法的說明文字還沒收集齊，無法模擬，這個欄位先空著'},'・（空欄，資料不足）'));
      return el('div',{class:'g'},el('b',{},(gi?'':'★')+n),el('span',{class:`rc r${g.r}`},`${g.r}★ Cost${g.c}`),sk)});
    const extra=x.r.srcs.length?`；戰法來源另需 ${x.r.srcs.join('、')}`:'';
    return el('div',{class:'team'},el('div',{class:'no'},String(i+1)),
      el('div',{},el('div',{class:'gens'},...gens),el('div',{class:'meta'},`${t.arm==='槍'?'足輕':t.arm}兵・總 Cost ${t.c}${extra}`)),
      el('div',{class:'big'},el('b',{},x.w+'%'),el('small',{},`打下 Lv${S.land}・剩兵 ${x.left}%`),el('span',{class:'res'},`約 ${fmt(x.res)} 抽`)))}));
}
render();
</script>
<script src="site-nav.js?v=6" data-page="rec"></script>
</body>
</html>
